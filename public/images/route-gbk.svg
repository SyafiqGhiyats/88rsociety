<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Map Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Surrounding City Roads (Subtle) -->
  <path d="M 50 150 L 750 150 M 50 350 L 750 350 M 180 50 L 180 450 M 620 50 L 620 450" 
        stroke="#272A34" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 280 80 Q 400 40 520 80 L 520 420 Q 400 460 280 420 Z" 
        stroke="#1E222B" stroke-width="16" stroke-linejoin="round" fill="none"/>

  <!-- GBK Stadium Inner Landmark Outline -->
  <ellipse cx="400" cy="250" rx="130" ry="95" stroke="#252A36" stroke-width="4" stroke-dasharray="6,6" fill="#12151D"/>
  <ellipse cx="400" cy="250" rx="70" ry="50" fill="#161B24"/>
  <text x="400" y="255" fill="#4B5563" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">GBK MAIN STADIUM</text>

  <!-- 88r Route Track Loop (Glow + Line) -->
  <path d="M 280 200 
           C 280 120, 360 90, 480 100 
           C 560 110, 600 170, 580 270 
           C 560 370, 480 400, 370 390 
           C 260 380, 230 310, 260 240 
           C 270 220, 280 210, 280 200 Z" 
        stroke="#CCFF00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Kilometer Checkpoints -->
  <!-- Start / Finish -->
  <g transform="translate(280, 200)">
    <circle r="14" fill="#CCFF00" />
    <circle r="6" fill="#090A0C" />
    <rect x="24" y="-12" width="110" height="24" rx="4" fill="#121316" stroke="#CCFF00" stroke-width="1"/>
    <text x="79" y="4" fill="#CCFF00" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">START / GATE 5</text>
  </g>

  <!-- KM 2 -->
  <g transform="translate(560, 130)">
    <circle r="8" fill="#0E1015" stroke="#00E5FF" stroke-width="3" />
    <text x="0" y="3" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">2K</text>
  </g>

  <!-- KM 5 -->
  <g transform="translate(480, 395)">
    <circle r="8" fill="#0E1015" stroke="#00E5FF" stroke-width="3" />
    <text x="0" y="3" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">5K</text>
  </g>

  <!-- Route Stats Badge (Bottom Left) -->
  <g transform="translate(30, 420)">
    <rect width="210" height="52" rx="8" fill="#12141C" stroke="#252A36" stroke-width="1"/>
    <text x="16" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="semibold">TOTAL DISTANCE</text>
    <text x="16" y="42" fill="#CCFF00" font-family="sans-serif" font-size="16" font-weight="bold">6.85 KM</text>
    <text x="120" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="semibold">ELEVATION</text>
    <text x="120" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">+28 M</text>
  </g>
</svg>
