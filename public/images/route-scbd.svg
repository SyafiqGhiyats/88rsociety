<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad3)"/>

  <!-- City Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="350" x2="800" y2="350" />
  </g>

  <!-- High-rise Blocks Outlines -->
  <rect x="250" y="160" width="120" height="80" rx="6" fill="#151821" stroke="#252A36"/>
  <rect x="420" y="160" width="140" height="80" rx="6" fill="#151821" stroke="#252A36"/>
  <rect x="250" y="270" width="130" height="80" rx="6" fill="#151821" stroke="#252A36"/>
  <rect x="410" y="270" width="150" height="80" rx="6" fill="#151821" stroke="#252A36"/>

  <text x="400" y="255" fill="#4B5563" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">SCBD FINANCIAL LOOP</text>

  <!-- SCBD Circuit Route -->
  <rect x="200" y="110" width="400" height="280" rx="36" 
        stroke="#00E5FF" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glowCyan)"/>

  <!-- Start Point -->
  <g transform="translate(200, 250)">
    <circle r="12" fill="#00E5FF" />
    <circle r="5" fill="#090A0C" />
    <rect x="18" y="-12" width="115" height="24" rx="4" fill="#121316" stroke="#00E5FF" stroke-width="1"/>
    <text x="75" y="4" fill="#00E5FF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">START: LOT 8</text>
  </g>

  <!-- Route Stats Badge -->
  <g transform="translate(30, 420)">
    <rect width="210" height="52" rx="8" fill="#12141C" stroke="#252A36" stroke-width="1"/>
    <text x="16" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="semibold">CIRCUIT LAP</text>
    <text x="16" y="42" fill="#00E5FF" font-family="sans-serif" font-size="16" font-weight="bold">2.5 KM / LAP</text>
    <text x="120" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="semibold">TOTAL SPEED</text>
    <text x="120" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">2 LAPS (5K)</text>
  </g>
</svg>
