<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoVolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#A5DB00"/>
    </linearGradient>
  </defs>
  <!-- 88 Sporty Emblem (Interlinked Loops) -->
  <g transform="translate(4, 10)">
    <!-- First '8' -->
    <path d="M 12 10 A 7 7 0 1 1 26 10 A 7 7 0 1 1 12 10 Z" stroke="#CCFF00" stroke-width="4.5" fill="none"/>
    <path d="M 10 27 A 9 9 0 1 1 28 27 A 9 9 0 1 1 10 27 Z" stroke="#CCFF00" stroke-width="4.5" fill="none"/>
    
    <!-- Second '8' / 'R' Accent -->
    <path d="M 32 10 A 7 7 0 1 1 46 10 A 7 7 0 1 1 32 10 Z" stroke="#FFFFFF" stroke-width="4.5" fill="none"/>
    <path d="M 30 27 A 9 9 0 1 1 48 27 A 9 9 0 1 1 30 27 Z" stroke="#FFFFFF" stroke-width="4.5" fill="none"/>
  </g>

  <!-- Typography: 88RSOCIETY -->
  <text x="64" y="32" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
    88R<tspan fill="#CCFF00">SOCIETY</tspan>
  </text>
  <text x="65" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="4" fill="#94A3B8">
    URBAN RUN COLLECTIVE
  </text>
</svg>
