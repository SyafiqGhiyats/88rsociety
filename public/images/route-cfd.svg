<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad2)"/>

  <!-- City Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="260" x2="800" y2="260" />
    <line x1="0" y1="380" x2="800" y2="380" />
  </g>

  <!-- Sudirman Highway Boulevard -->
  <line x1="80" y1="420" x2="720" y2="80" stroke="#1F232D" stroke-width="32" stroke-linecap="round"/>
  <line x1="80" y1="420" x2="720" y2="80" stroke="#2B303E" stroke-width="2" stroke-dasharray="10,12"/>

  <!-- Semanggi Interchange Cloverleaf Outline (Landmark) -->
  <circle cx="360" cy="270" r="45" stroke="#252B38" stroke-width="8" fill="none"/>
  <circle cx="440" cy="230" r="45" stroke="#252B38" stroke-width="8" fill="none"/>

  <!-- Route Line (FX Sudirman to Bundaran HI & Return) -->
  <path d="M 120 400 L 360 270 Q 400 250 440 230 L 680 100 Q 700 90 710 105 L 700 125 L 460 250 L 140 420 Z" 
        stroke="#FF5722" stroke-width="5" stroke-linejoin="round" fill="none" filter="url(#glowOrange)"/>

  <!-- Points -->
  <g transform="translate(120, 400)">
    <circle r="12" fill="#FF5722" />
    <circle r="5" fill="#090A0C" />
    <rect x="18" y="-12" width="135" height="24" rx="4" fill="#121316" stroke="#FF5722" stroke-width="1"/>
    <text x="85" y="4" fill="#FF5722" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">START: FX SUDIRMAN</text>
  </g>

  <g transform="translate(680, 100)">
    <circle r="8" fill="#090A0C" stroke="#CCFF00" stroke-width="3" />
    <text x="0" y="-14" fill="#CCFF00" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">BUNDARAN HI U-TURN</text>
  </g>

  <!-- Route Stats Badge -->
  <g transform="translate(30, 30)">
    <rect width="210" height="52" rx="8" fill="#12141C" stroke="#252A36" stroke-width="1"/>
    <text x="16" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="semibold">TOTAL DISTANCE</text>
    <text x="16" y="42" fill="#FF5722" font-family="sans-serif" font-size="16" font-weight="bold">15.4 KM</text>
    <text x="120" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="semibold">ELEVATION</text>
    <text x="120" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">+45 M</text>
  </g>
</svg>
